openapi: 3.0.0
info:
  title: CEO Trading Platform API
  description: API for authentication, users, portfolios, orders, positions, and market data.
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:8081
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /api/auth/login:
    post:
      summary: Log in
      description: Authenticates a user and returns an access token and refresh token.
      operationId: login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/refresh:
    post:
      summary: Refresh authentication tokens
      description: Rotates the valid HttpOnly refresh-token cookie and returns a new access token. The response sets a replacement refresh-token cookie.
      operationId: refreshTokens
      tags: [Authentication]
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/logout:
    post:
      summary: Log out
      description: Revokes the refresh-token cookie and clears it.
      operationId: logout
      tags: [Authentication]
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }

  /api/auth/change-password:
    post:
      summary: Change the current user's password
      description: Verifies the current password and replaces it with a new BCrypt hash.
      operationId: changePassword
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePasswordResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Authentication required or current password is incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/me:
    get:
      summary: Get the current authenticated user
      operationId: getCurrentUser
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users:
    post:
      summary: Create a user account
      description: Creates a new user account with the CLIENT role by default.
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/users/{userId}:
    get:
      summary: Get a user profile
      operationId: getUser
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update user profile information
      description: Updates the supplied name and/or email fields.
      operationId: updateUser
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInfoRequest' }
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/users/{userId}/portfolios:
    get:
      summary: Get all portfolios for a user
      description: Returns portfolios joined to the user through portfolio.client_id = user_account.user_id. Each portfolio may contain its own holdings.
      operationId: getUserPortfolios
      tags: [Client]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: User portfolios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortfolioModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/order:
    get:
      summary: Get all orders
      operationId: getAllOrders
      tags: [Orders]
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponseDTO' }

  /api/order/{orderID}:
    get:
      summary: Get an order by ID
      operationId: getOrder
      tags: [Orders]
      parameters: [{ $ref: '#/components/parameters/OrderID' }]
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponseDTO' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/order/by_client/{clientID}:
    get:
      summary: Get orders by client ID
      operationId: getClientOrders
      tags: [Orders]
      parameters: [{ $ref: '#/components/parameters/ClientId' }]
      responses:
        '200':
          description: Client orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponseDTO' }

  /api/order/new:
    post:
      summary: Submit a new order
      operationId: submitOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequestDTO' }
      responses:
        '201':
          description: Order created and submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponseDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/portfolio/{portfolioId}/buying_power:
    get:
      summary: Get portfolio buying power
      operationId: getBuyingPowerByPortfolioId
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Buying power
          content:
            application/json:
              schema: { type: number, format: double }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/portfolio:
    post:
      summary: Create a portfolio
      operationId: createPortfolio
      tags: [Portfolios]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePortfolioRequest' }
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/portfolio/{portfolioId}/total_value:
    get:
      summary: Get total portfolio value
      operationId: getTotalValueByPortfolioId
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Total portfolio value
          content:
            application/json:
              schema: { type: number, format: double }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/portfolio/{portfolioId}/holdings:
    get:
      summary: Get portfolio holdings with live market statistics
      operationId: getHoldingsByPortfolioId
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Portfolio holdings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HoldingSummaryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/portfolio/{portfolioId}:
    get:
      summary: Get a portfolio by ID
      operationId: getPortfolioById
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Portfolio details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/quotes/{symbol}:
    get:
      summary: Get a market quote
      operationId: getStockQuote
      tags: [Market Data]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/candles/{symbol}/api/candles:
    get:
      summary: Get candle data
      description: This path reflects the controller's current combined class and method mapping.
      operationId: getCandles
      tags: [Market Data]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: param
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Candle response
          content:
            text/plain:
              schema: { type: string }

  /api/analytics/volume:
    get:
      summary: Get trading volume
      description: Returns fulfilled trading volume for a date range, optionally filtered by instrument and client segment.
      operationId: getTradingVolume
      tags:
        - Analyst Analytics
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: symbol
          in: query
          required: false
          description: Instrument symbol filter.
          schema:
            type: string
          example: AAPL
        - name: clientSegment
          in: query
          required: false
          description: Client segment filter.
          schema:
            type: string
            enum: [RETAIL, HIGH_NET_WORTH, INSTITUTIONAL]
      responses:
        '200':
          description: Aggregated fulfilled trading volume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingVolumeInsight'
        '400':
          description: Invalid date range or filter.
        '500':
          description: Internal server error.

  /api/analytics/top-instruments:
    get:
      summary: Get most actively traded instruments
      description: Returns instruments ranked by fulfilled trading notional for a date range.
      operationId: getTopInstruments
      tags:
        - Analyst Analytics
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: limit
          in: query
          required: false
          description: Maximum number of instruments to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
      responses:
        '200':
          description: Ranked instrument insights.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopInstrumentInsight'
        '400':
          description: Invalid date range or limit.
        '500':
          description: Internal server error.

  /api/analytics/top-movers:
    get:
      summary: Get instruments with the largest current percentage price moves
      operationId: getTopMovers
      tags:
        - Analyst Analytics
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of movers to return.
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 5
      responses:
        '200':
          description: Current market movers ranked by absolute percentage change.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopMover'
        '500':
          description: Market data service error.

  /api/analytics/client-activity-trends:
    get:
      summary: Get client activity trends
      description: Returns daily fulfilled trading activity grouped by client segment.
      operationId: getClientActivityTrends
      tags:
        - Analyst Analytics
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: clientSegment
          in: query
          required: false
          description: Client segment filter.
          schema:
            type: string
            enum: [RETAIL, HIGH_NET_WORTH, INSTITUTIONAL]
      responses:
        '200':
          description: Client activity trend points.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientActivityTrendPoint'
        '400':
          description: Invalid date range or segment.
        '500':
          description: Internal server error.

  /api/analytics/candles/{symbol}/{type}:
    get:
      summary: Get historical candles
      description: Returns historical daily market candles for an instrument.
      operationId: getHistoricalCandles
      tags:
        - Analyst Analytics
      parameters:
        - name: symbol
          in: path
          required: true
          description: Instrument symbol.
          schema:
            type: string
          example: AAPL
        - name: type
          in: path
          required: true
          description: Instrument type.
          schema:
            type: string
            enum: [EQUITY, CASH, CRYPTO]
          example: EQUITY
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historical daily candles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candle'
        '400':
          description: Invalid date range or symbol.
        '404':
          description: Instrument symbol was not found by the market data provider.
        '429':
          description: Market data provider quota or rate limit was reached.
        '502':
          description: Market data provider returned a server error.
        '500':
          description: Internal server error.





          

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FromDate:
      name: from
      in: query
      required: true
      description: Inclusive start date for the analytics period.
      schema:
        type: string
        format: date
      example: '2026-01-01'

    ToDate:
      name: to
      in: query
      required: true
      description: Inclusive end date for the analytics period.
      schema:
        type: string
        format: date
      example: '2026-10-15'

    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ClientId:
      name: clientID
      in: path
      required: true
      schema: { type: string, format: uuid }

    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema: { type: string, format: uuid }

    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }

    OrderID:
      name: orderID
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: User is not allowed to access this resource
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmNewPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }
        confirmNewPassword: { type: string, format: password, minLength: 8 }
    ChangePasswordResponse:
      type: object
      properties:
        message: { type: string }
        changedAt: { type: string, format: date-time }
    LogoutResponse:
      type: object
      properties:
        message: { type: string }
        loggedOutAt: { type: string, format: date-time }
    LoginResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        accessToken: { type: string }
        expiresIn:
          type: integer
          format: int64
          description: Access-token lifetime in milliseconds.
        role:
          type: string
          enum: [CLIENT, ANALYST, ADMIN]
    CreateUserRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    UpdateInfoRequest:
      type: object
      description: At least one field should be supplied.
      properties:
        newName: { type: string }
        newEmail: { type: string, format: email }
    UserResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        joinDate: { type: string, format: date-time }
        role:
          type: string
          enum: [CLIENT, ANALYST, ADMIN]
    TradingVolumeInsight:
      type: object
      required:
        - from
        - to
        - symbol
        - clientSegment
        - totalNotional
        - totalQuantity
        - executedTrades
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        symbol:
          type: string
        clientSegment:
          type: string
        totalNotional:
          type: number
          format: double
        totalQuantity:
          type: number
          format: double
        executedTrades:
          type: integer
          format: int64

    TopInstrumentInsight:
      type: object
      required:
        - symbol
        - totalNotional
        - totalQuantity
        - executedTrades
      properties:
        symbol:
          type: string
        totalNotional:
          type: number
          format: double
        totalQuantity:
          type: number
          format: double
        executedTrades:
          type: integer
          format: int64

    TopMover:
      type: object
      required:
        - symbol
        - currentPrice
        - previousClose
        - percentageChange
      properties:
        symbol:
          type: string
        currentPrice:
          type: number
          format: double
        previousClose:
          type: number
          format: double
        percentageChange:
          type: number
          format: double

    ClientActivityTrendPoint:
      type: object
      required:
        - periodStart
        - clientSegment
        - totalNotional
        - totalQuantity
        - executedTrades
      properties:
        periodStart:
          type: string
          format: date-time
        clientSegment:
          type: string
        totalNotional:
          type: number
          format: double
        totalQuantity:
          type: number
          format: double
        executedTrades:
          type: integer
          format: int64

    Candle:
      type: object
      properties:
        date:
          type: string
          format: date
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        adjclose:
          type: number
          format: double
        volume:
          type: integer
          format: int64
        synthetic:
          type: boolean
    OrderRequestDTO:
      type: object
      required: [clientId, clientName, portfolioId, addInstrumentSymbol, addInstrumentType, subtractInstrumentSymbol, subtractInstrumentType, quantity, quotedPrice, side, changeThreshold, market]
      properties:
        clientId: { type: string, format: uuid }
        clientName: { type: string }
        portfolioId: { type: string, format: uuid }
        addInstrumentSymbol: { type: string }
        addInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        subtractInstrumentSymbol: { type: string }
        subtractInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        quantity: { type: number, format: double }
        quotedPrice: { type: number, format: double }
        side: { $ref: '#/components/schemas/Side' }
        changeThreshold: { type: number, format: double }
        market: { type: string }
    OrderResponseDTO:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        addInstrumentSymbol: { type: string }
        addInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        addInstrumentFullName: { type: string }
        subtractInstrumentSymbol: { type: string }
        subtractInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        subtractInstrumentFullName: { type: string }
        quantity: { type: number, format: double }
        quotedPrice: { type: number, format: double }
        side: { $ref: '#/components/schemas/Side' }
        changeThreshold: { type: number, format: double }
        createdDate: { type: string }
        resolvedDate: { type: string }
        currentStatus: { $ref: '#/components/schemas/OrderStatus' }
    HoldingSummaryResponse:
      type: object
      description: Holding data from the database enriched with live market statistics.
      properties:
        holdingId: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        symbol: { type: string }
        companyName: { type: string }
        shares: { type: number, format: double }
        avgCost: { type: number, format: double }
        currentPrice: { type: number, format: double, description: Latest market price. }
        dayChangeValue: { type: number, format: double, description: Latest market price change per share. }
        percentChange:
          type: object
          additionalProperties: { type: number, format: double }
          description: Live percentage change keyed by 1D, 5D, 1M, 6M, and 1Y.
        weekLow52: { type: number, format: double, description: Lowest daily market price in the one-year candle range. }
        weekHigh52: { type: number, format: double, description: Highest daily market price in the one-year candle range. }
    PortfolioResponse:
      type: object
      properties:
        ID: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        holdingIds:
          type: array
          items: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PortfolioType' }
    CreatePortfolioRequest:
      type: object
      required: [name, type, clientId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/PortfolioType' }
        clientId: { type: string, format: uuid }
    QuoteData:
      type: object
      properties:
        symbol: { type: string }
        price: { type: number, format: double }
        bid: { type: number, format: double }
        ask: { type: number, format: double }
        spreadBps: { type: number, format: double }
        currency: { type: string }
        change: { type: number, format: double }
        changePercent: { type: number, format: double }
        previousClose: { type: number, format: double }
        asOf: { type: string, format: date-time }
        marketState: { type: string }
    OrderModel:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        side: { $ref: '#/components/schemas/Side' }
        portfolioId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        quote: { type: number, format: double }
        increaseThreshold: { type: number, format: double }
        quantity: { type: number, format: double }
        createdDate: { type: string, format: date-time }
        currentOrderStatus: { $ref: '#/components/schemas/OrderStatusChangeModel' }
        model: { type: string }
    OrderStatusChangeModel:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        date: { type: string, format: date-time }
    HoldingModel:
      type: object
      properties:
        ID: { type: string, format: uuid }
        dateCreated: { type: string, format: date-time }
        instrument: { $ref: '#/components/schemas/InstrumentModel' }
        order: { $ref: '#/components/schemas/OrderModel' }
        purchasedPrice: { type: number, format: double }
        quantity: { type: number, format: double }
    InstrumentModel:
      type: object
      properties:
        ID: { type: string, format: uuid }
        symbol: { type: string }
        type: { $ref: '#/components/schemas/InstrumentType' }
        fullName: { type: string }
    PortfolioModel:
      type: object
      properties:
        portfolioId: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/HoldingModel' }
        type: { $ref: '#/components/schemas/PortfolioType' }
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
    Side:
      type: string
      enum: [BUY, SELL]
    OrderStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, FULFILLED, CANCELLED]
    InstrumentType:
      type: string
      enum: [EQUITY, CASH, CRYPTO]
    PortfolioType:
      type: string
      enum: [RETIREMENT, BROKERAGE]

