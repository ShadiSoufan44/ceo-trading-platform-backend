openapi: 3.0.0
info:
  title: CEO Trading Platform API
  description: API for authentication, users, portfolios, orders, positions, and market data.
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:8081
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /api/users/{userId}/portfolios:
    get:
      summary: Get all portfolios for a user
      description: Returns portfolios joined to the user through portfolio.client_id = user_account.user_id. Each portfolio may contain its own holdings.
      operationId: getUserPortfolios
      tags: [Client]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: User portfolios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortfolioModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /order:
    get:
      summary: Get all orders
      operationId: getAllOrders
      tags: [Orders]
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponseDTO' }

  /order/{orderID}:
    get:
      summary: Get an order by ID
      operationId: getOrder
      tags: [Orders]
      parameters: [{ $ref: '#/components/parameters/OrderID' }]
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponseDTO' }
        '404': { $ref: '#/components/responses/NotFound' }

  /order/by_client/{clientID}:
    get:
      summary: Get orders by client ID
      operationId: getClientOrders
      tags: [Orders]
      parameters: [{ $ref: '#/components/parameters/ClientId' }]
      responses:
        '200':
          description: Client orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponseDTO' }

  /order/new:
    post:
      summary: Submit a new order
      operationId: submitOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequestDTO' }
      responses:
        '201':
          description: Order created and submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponseDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/portfolio/{portfolioId}/buying_power:
    get:
      summary: Get portfolio buying power
      operationId: getBuyingPowerByPortfolioId
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Buying power
          content:
            application/json:
              schema: { type: number, format: double }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/portfolio/{portfolioId}/total_value:
    get:
      summary: Get total portfolio value
      operationId: getTotalValueByPortfolioId
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Total portfolio value
          content:
            application/json:
              schema: { type: number, format: double }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/portfolio/{portfolioId}/holdings:
    get:
      summary: Get portfolio holdings
      operationId: getHoldingsByPortfolioId
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Portfolio holdings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HoldingResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/portfolio/{portfolioId}:
    get:
      summary: Get a portfolio by ID
      operationId: getPortfolioById
      tags: [Portfolios]
      parameters: [{ $ref: '#/components/parameters/PortfolioId' }]
      responses:
        '200':
          description: Portfolio details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/quotes/{symbol}:
    get:
      summary: Get a market quote
      operationId: getStockQuote
      tags: [Market Data]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/candles/{symbol}/api/candles:
    get:
      summary: Get candle data
      description: This path reflects the controller's current combined class and method mapping.
      operationId: getCandles
      tags: [Market Data]
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: param
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Candle response
          content:
            text/plain:
              schema: { type: string }

  /api/analytics/volume:
    get:
      summary: Get trading volume
      description: Returns fulfilled trading volume for a date range, optionally filtered by instrument and client segment.
      operationId: getTradingVolume
      tags:
        - Analyst Analytics
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: symbol
          in: query
          required: false
          description: Instrument symbol filter.
          schema:
            type: string
          example: AAPL
        - name: clientSegment
          in: query
          required: false
          description: Client segment filter.
          schema:
            type: string
            enum: [RETAIL, HIGH_NET_WORTH, INSTITUTIONAL]
      responses:
        '200':
          description: Aggregated fulfilled trading volume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingVolumeInsight'
        '400':
          description: Invalid date range or filter.
        '500':
          description: Internal server error.

  /api/analytics/top-instruments:
    get:
      summary: Get most actively traded instruments
      description: Returns instruments ranked by fulfilled trading notional for a date range.
      operationId: getTopInstruments
      tags:
        - Analyst Analytics
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: limit
          in: query
          required: false
          description: Maximum number of instruments to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
      responses:
        '200':
          description: Ranked instrument insights.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopInstrumentInsight'
        '400':
          description: Invalid date range or limit.
        '500':
          description: Internal server error.

  /api/analytics/client-activity-trends:
    get:
      summary: Get client activity trends
      description: Returns daily fulfilled trading activity grouped by client segment.
      operationId: getClientActivityTrends
      tags:
        - Analyst Analytics
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: clientSegment
          in: query
          required: false
          description: Client segment filter.
          schema:
            type: string
            enum: [RETAIL, HIGH_NET_WORTH, INSTITUTIONAL]
      responses:
        '200':
          description: Client activity trend points.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientActivityTrendPoint'
        '400':
          description: Invalid date range or segment.
        '500':
          description: Internal server error.

  /api/analytics/candles/{symbol}:
    get:
      summary: Get historical candles
      description: Returns historical daily market candles for an instrument.
      operationId: getHistoricalCandles
      tags:
        - Analyst Analytics
      parameters:
        - name: symbol
          in: path
          required: true
          description: Instrument symbol.
          schema:
            type: string
          example: AAPL
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historical daily candles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candle'
        '400':
          description: Invalid date range or symbol.
        '500':
          description: Internal server error.





          

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FromDate:
      name: from
      in: query
      required: true
      description: Inclusive start date for the analytics period.
      schema:
        type: string
        format: date
      example: '2026-01-01'

    ToDate:
      name: to
      in: query
      required: true
      description: Inclusive end date for the analytics period.
      schema:
        type: string
        format: date
      example: '2026-10-15'

    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ClientId:
      name: clientID
      in: path
      required: true
      schema: { type: string, format: uuid }

    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema: { type: string, format: uuid }

    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }

    OrderID:
      name: orderID
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: User is not allowed to access this resource
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  
  schemas:
    TradingVolumeInsight:
      type: object
      required:
        - from
        - to
        - symbol
        - clientSegment
        - totalNotional
        - totalQuantity
        - executedTrades
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        symbol:
          type: string
        clientSegment:
          type: string
        totalNotional:
          type: number
          format: double
        totalQuantity:
          type: number
          format: double
        executedTrades:
          type: integer
          format: int64

    TopInstrumentInsight:
      type: object
      required:
        - symbol
        - totalNotional
        - totalQuantity
        - executedTrades
      properties:
        symbol:
          type: string
        totalNotional:
          type: number
          format: double
        totalQuantity:
          type: number
          format: double
        executedTrades:
          type: integer
          format: int64

    ClientActivityTrendPoint:
      type: object
      required:
        - periodStart
        - clientSegment
        - totalNotional
        - totalQuantity
        - executedTrades
      properties:
        periodStart:
          type: string
          format: date-time
        clientSegment:
          type: string
        totalNotional:
          type: number
          format: double
        totalQuantity:
          type: number
          format: double
        executedTrades:
          type: integer
          format: int64

    Candle:
      type: object
      properties:
        date:
          type: string
          format: date
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        adjclose:
          type: number
          format: double
        volume:
          type: integer
          format: int64
        synthetic:
          type: boolean

    OrderRequestDTO:
      type: object
      required: [clientId, clientName, portfolioId, addInstrumentSymbol, addInstrumentType, subtractInstrumentSymbol, subtractInstrumentType, quantity, quotedPrice, side, changeThreshold, market]
      properties:
        clientId: { type: string, format: uuid }
        clientName: { type: string }
        portfolioId: { type: string, format: uuid }
        addInstrumentSymbol: { type: string }
        addInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        subtractInstrumentSymbol: { type: string }
        subtractInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        quantity: { type: number, format: double }
        quotedPrice: { type: number, format: double }
        side: { $ref: '#/components/schemas/Side' }
        changeThreshold: { type: number, format: double }
        market: { type: string }
    OrderResponseDTO:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        addInstrumentSymbol: { type: string }
        addInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        addInstrumentFullName: { type: string }
        subtractInstrumentSymbol: { type: string }
        subtractInstrumentType: { $ref: '#/components/schemas/InstrumentType' }
        subtractInstrumentFullName: { type: string }
        quantity: { type: number, format: double }
        quotedPrice: { type: number, format: double }
        side: { $ref: '#/components/schemas/Side' }
        changeThreshold: { type: number, format: double }
        createdDate: { type: string }
        resolvedDate: { type: string }
        currentStatus: { $ref: '#/components/schemas/OrderStatus' }
    HoldingResponse:
      type: object
      properties:
        holdingId: { type: string, format: uuid }
        dateCreated: { type: string, format: date-time }
        instrumentId: { type: string, format: uuid }
        instrumentSymbol: { type: string, format: string }
        instrumentName: { type: string, format: string }
        instrumentType: { $ref: '#/components/schemas/InstrumentType' }
        orderId: { type: string, format: uuid }
        purchasedPrice: { type: number, format: double }
        quantity: { type: number, format: double }
    PortfolioResponse:
      type: object
      properties:
        ID: { type: string, format: uuid }
        holdingIds:
          type: array
          items: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PortfolioType' }
    QuoteData:
      type: object
      properties:
        symbol: { type: string }
        price: { type: number, format: double }
        bid: { type: number, format: double }
        ask: { type: number, format: double }
        spreadBps: { type: number, format: double }
        currency: { type: string }
        change: { type: number, format: double }
        changePercent: { type: number, format: double }
        previousClose: { type: number, format: double }
        asOf: { type: string, format: date-time }
        marketState: { type: string }
    OrderModel:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        side: { $ref: '#/components/schemas/Side' }
        portfolioId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        quote: { type: number, format: double }
        increaseThreshold: { type: number, format: double }
        quantity: { type: number, format: double }
        createdDate: { type: string, format: date-time }
        currentOrderStatus: { $ref: '#/components/schemas/OrderStatusChangeModel' }
        model: { type: string }
    OrderStatusChangeModel:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        date: { type: string, format: date-time }
    HoldingModel:
      type: object
      properties:
        ID: { type: string, format: uuid }
        dateCreated: { type: string, format: date-time }
        instrument: { $ref: '#/components/schemas/InstrumentModel' }
        order: { $ref: '#/components/schemas/OrderModel' }
        purchasedPrice: { type: number, format: double }
        quantity: { type: number, format: double }
    InstrumentModel:
      type: object
      properties:
        ID: { type: string, format: uuid }
        symbol: { type: string }
        type: { $ref: '#/components/schemas/InstrumentType' }
        fullName: { type: string }
    PortfolioModel:
      type: object
      properties:
        portfolioId: { type: string, format: uuid }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/HoldingModel' }
        type: { $ref: '#/components/schemas/PortfolioType' }
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
    Side:
      type: string
      enum: [BUY, SELL]
    OrderStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, FULFILLED, CANCELLED]
    InstrumentType:
      type: string
      enum: [EQUITY, CASH, CRYPTO]
    PortfolioType:
      type: string
      enum: [RETIREMENT, BROKERAGE]

tags:
  - name: Authentication
  - name: Users
  - name: Client
  - name: Orders
    description: Order management operations
  - name: Analyst Analytics
    description: Read-only trading analytics for analyst users
  - name: Portfolios
  - name: Market Data
