spring.application.name=trading-platform-backend

# spring.datasource.url=jdbc:postgresql://localhost:5432/trading_platform
# spring.datasource.username=trading_platform
# spring.datasource.password=trading_platform

# # Flyway (via V1__init_schema.sql etc.) owns the schema; Hibernate must never auto-generate or alter it.
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true


# Kafka Stuff
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ceo.trading_platform_backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.bootstrap-servers=localhost:9092


spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.flyway.baselineOnMigrate = true
server.port=8081

# MARKET DATA API
market.api.key=${MARKET_API_KEY}
