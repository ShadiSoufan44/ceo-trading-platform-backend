spring.application.name=trading-platform-backend

# Kafka Stuff
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ceo.trading_platform_backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.bootstrap-servers=linux.livefree.click:9092

spring.config.import=optional:file:.env[.properties]

# spring.datasource.url=jdbc:postgresql://localhost:5432/trading_platform
# spring.datasource.username=trading_platform
# spring.datasource.password=trading_platform

# # Flyway (via V1__init_schema.sql etc.) owns the schema; Hibernate must never auto-generate or alter it.
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# server.port=8081
server.port=5000

# JWT configuration. JWT_SECRET must be a strong secret of at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:2592000}
# Automatically refresh analyst reporting from fulfilled orders.
analytics.etl.enabled=${ANALYTICS_ETL_ENABLED:true}
analytics.etl.fixed-delay-ms=${ANALYTICS_ETL_FIXED_DELAY_MS:300000}
analytics.etl.initial-delay-ms=${ANALYTICS_ETL_INITIAL_DELAY_MS:60000}
analytics.etl.python-executable=${ANALYTICS_ETL_PYTHON:}
analytics.etl.script=analytics/etl_pipeline.py
analytics.etl.output-dir=analytics/output-real

# MARKET DATA API
market.api.key=${MARKET_API_KEY:${api_key:}}
