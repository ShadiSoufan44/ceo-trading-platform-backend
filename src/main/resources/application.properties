spring.application.name=trading-platform-backend

# spring.datasource.url=jdbc:postgresql://localhost:5432/trading_platform
# spring.datasource.username=trading_platform
# spring.datasource.password=trading_platform

# # Flyway (via V1__init_schema.sql etc.) owns the schema; Hibernate must never auto-generate or alter it.
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.flyway.baselineOnMigrate = true
server.port=8081
